{% extends 'base.html' %}{% block title %}{{ 'Add care record' if is_care else 'Add appointment' }}{% endblock %}{% block content %}<a href="{{ url_for('pet_detail',pet_id=pet.id) }}">← Back to {{ pet.name }}</a><section class="panel form-panel"><h1>{{ 'Add care record' if is_care else 'Add appointment' }}</h1><p>For {{ pet.name }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% if is_care %}<label for="kind">Care type</label><select id="kind" name="kind" required>{% for kind in types %}<option {% if request.form.get('kind') == kind %}selected{% endif %}>{{ kind }}</option>{% endfor %}</select><label for="care_date">Care date</label><input type="date" id="care_date" name="care_date" required value="{{ request.form.get('care_date','') }}"><label for="due_date">Next due date (optional)</label><input type="date" id="due_date" name="due_date" value="{{ request.form.get('due_date','') }}">{% else %}<label for="clinic">Clinic name</label><input id="clinic" name="clinic" required maxlength="150" value="{{ request.form.get('clinic','') }}"><label for="visit_at">Appointment date and time (Sydney time)</label><input type="datetime-local" id="visit_at" name="visit_at" required value="{{ request.form.get('visit_at','') }}">{% endif %}<label for="notes">Notes (optional)</label><textarea id="notes" name="notes" maxlength="1000" rows="4">{{ request.form.get('notes','') }}</textarea><button type="submit">{{ 'Save care record' if is_care else 'Save appointment' }}</button></form></section>{% endblock %}
