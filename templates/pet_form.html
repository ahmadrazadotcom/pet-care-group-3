{% extends 'base.html' %}{% block title %}{{ 'Edit pet' if pet else 'Add a pet' }}{% endblock %}{% block content %}<a href="{{ url_for('pet_detail',pet_id=pet.id) if pet else url_for('dashboard') }}">← Back</a><section class="panel form-panel"><h1>{{ 'Edit pet details' if pet else 'Add a pet' }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="name">Pet name</label><input id="name" name="name" required maxlength="100" value="{{ request.form.get('name',pet.name if pet else '') }}"><label for="species">Species</label><input id="species" name="species" required maxlength="100" placeholder="e.g. Dog" value="{{ request.form.get('species',pet.species if pet else '') }}"><label for="breed">Breed (optional)</label><input id="breed" name="breed" maxlength="100" value="{{ request.form.get('breed',pet.breed if pet else '') }}"><button type="submit">Save pet</button></form></section>{% endblock %}
