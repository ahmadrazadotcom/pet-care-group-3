<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Pet Care{% endblock %} | Pet Care</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><nav class="nav-wrap"><a class="brand" href="{{ url_for('dashboard') }}">Pet Care <span>Information System</span></a>{% if session.get('user_id') %}<div class="nav-actions"><a href="{{ url_for('dashboard') }}">Dashboard</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary" type="submit">Sign out</button></form></div>{% endif %}</nav></header><main class="shell">{% for category,message in get_flashed_messages(with_categories=true) %}<div role="alert" class="notice {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Pet Care Information System · Group 3 · ICT305</footer></body></html>
